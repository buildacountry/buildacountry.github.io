<style>

:root { color-scheme: light; --sky: #f1dfbf; --card: rgba(251,246,236,.96); --line: rgba(80,60,40,.16); --ink: #2f2b28; --ink-dim: #6f6458; --terracotta: #c8603f; --copper: #4f9a86; --copper-ink: #12392f;

.brand { pointer-events: auto; margin-right: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; display: grid; gap: 2px; }

.brand p { margin: 0; font-size: .76rem; color: var(--ink-dim); } .brand b { color: var(--terracotta); font-variant-numeric: tabular-nums; }

(() => {

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;

    const c = text[i];

    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;

infoBtn.onclick = () => { if (!selected) showKey('welcome'); openCard(); };
function show(eye, title, body) { cardEye.textContent = eye; cardTitle.textContent = title; cardTitle.style.fontSize = title.length > 20 ? '1.05rem' : title.length > 14 ? '1.25rem' : ''; cardBody.innerHTML = body; openCard(); }
const CONTENT = {
  welcome: ['Loading citizens…', 'A country being built by its people',
    `<p class="p">Every person who follows becomes a citizen, and their home appears on this map with their Instagram name on it.</p>`],
  flag: ['Day 0 · city centre', 'The first flag',
    `<p class="p">This is where the country began. The first 20 citizens got their founder homes around this flag.</p>
     <p class="p">Everyone who follows now gets a home in the next district.</p>`],
  centre: ['City centre', 'Empty land around the flag',
    `<p class="p">The first homes of the country stand here, around the flag.</p>`],
  forest: ['The forest', 'Untouched forest',
    `<p class="p">Most of the country is still forest. As more people join, new areas will open up here.</p>`],
  land: ['Unexplored land', 'Beyond the fog',
    `<p class="p">Nobody knows how far the land goes yet. The fog clears as the country grows and more citizens join.</p>`],
  coast: ['The coast', 'A long, empty beach',
    `<p class="p">No one has built anything by the sea yet.</p>`],
  sea: ['The sea', 'The edge of our country',
    `<p class="p">For now, the land ends here. It grows as the country grows.</p>`],

};
function showKey(k) { const c = CONTENT[k] || CONTENT.land; show(c[0], c[1], c[2]); }

// ---------- picking ----------
const ray = new THREE.Raycaster(), m2 = new THREE.Vector2(); let down = null, hoverFlag = false;
function pickAt(cx, cy) { const r = renderer.domElement.getBoundingClientRect(); m2.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1);
  ray.setFromCamera(m2, camera); const hit = ray.intersectObjects(pickables, false)[0]; return hit ? (hit.object.userData.homes ? { home: hit.object.userData.homes[hit.instanceId] } : hit.object.userData.place) : null; }
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || e.buttons) return; const p = pickAt(e.clientX, e.clientY); hoverFlag = p === 'flag' || (p && p.home); renderer.domElement.style.cursor = hoverFlag ? 'pointer' : 'grab'; });
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; fly = null; stopTour(); });
renderer.domElement.addEventListener('pointerup', e => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const p = pickAt(e.clientX, e.clientY); if (!p) return;
  if (p.home) { selectHome(p.home); return; }
  if (p === 'flag') { clearSelection(); showKey('flag'); flyFlag(); return; }
  // tapped empty land or trees: just let go of the selected home, don't pop a card
  if (selected) { clearSelection(); showKey('welcome'); if (narrow) setMin(true); } });

// ---------- camera ----------
let fly = null, touring = false;
function flyTo(t, off, ms = 1200) { fly = { t0: performance.now(), ms, fT: controls.target.clone(), tT: t, fP: camera.position.clone(), tP: t.clone().add(off) }; }
const viewAll = () => flyTo(new THREE.Vector3(0, 0, 0), new THREE.Vector3(180, 200, 270), 1400);
const flyFlag = () => flyTo(new THREE.Vector3(0, 6, 0), new THREE.Vector3(32, 22, 42));

// ---------- search ----------
const q = document.getElementById('q'), res = document.getElementById('results');
let pick = 0;
function runSearch() {
  const raw = q.value.trim(), s = raw.replace(/^@/, '').replace(/^#/, '').toLowerCase();
  if (!s) { res.hidden = true; return; }
  const num = /^\d+$/.test(s) ? +s : 0;
  const score = h => { if (num && h.n === num) return 0; const u = h.user.toLowerCase(); if (h.status === 'hidden') return 99; if (u === s) return 1; if (u.startsWith(s)) return 2; if (u.includes(s)) return 3; if (h.status !== 'abandoned' && (h.job || '').toLowerCase().includes(s)) return 4; return 99; };
  const m = homes.map(h => [score(h), h]).filter(x => x[0] < 99).sort((a, b) => a[0] - b[0] || a[1].n - b[1].n).map(x => x[1]).slice(0, 8);
  pick = 0;
  const label = h => h.status === 'abandoned' ? 'Abandoned' : (h.founder ? 'Founder home' : 'Home') + ' #' + h.n;
  res.innerHTML = m.length
    ? `<div class="hint">${m.length === 1 ? '1 home found' : m.length + ' homes found'} · press Enter to go</div>` + m.map((h, i) => `<button data-n="${h.n}" class="${i === 0 ? 'on' : ''}">${esc(h.shown)}<span>${label(h)}${h.job && h.status !== 'abandoned' ? ' · ' + esc(h.job) : ''}</span></button>`).join('')
    : `<div class="empty-res"><b>No home for "${esc(raw)}" yet</b><span>Check the spelling, or follow <a href="https://www.instagram.com/buildacountry/" target="_blank" rel="noopener">@buildacountry</a>. New homes are added every day.</span></div>`;
  res.hidden = false;
  res.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => { const h = homes.find(x => x.n === +b.dataset.n); res.hidden = true; q.value = ''; q.blur(); if (narrow) setMin(false); selectHome(h); });
}
q.addEventListener('input', runSearch);
q.addEventListener('focus', () => { if (q.value.trim()) runSearch(); });
q.addEventListener('keydown', e => {
  const bs = [...res.querySelectorAll('button[data-n]')];
  if (e.key === 'Escape') { res.hidden = true; q.blur(); return; }
  if (!bs.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pick = (pick + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, i) => b.classList.toggle('on', i === pick)); bs[pick].scrollIntoView({ block: 'nearest' }); }
  if (e.key === 'Enter') { e.preventDefault(); bs[pick].click(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement !== q) closeCard(); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) res.hidden = true; });

const tourBtn = document.getElementById('tour');
function stopTour() { touring = false; tourBtn.setAttribute('aria-pressed', 'false'); tourBtn.textContent = 'Auto tour'; }
tourBtn.onclick = () => { touring = !touring; tourBtn.setAttribute('aria-pressed', String(touring)); tourBtn.textContent = touring ? 'Stop tour' : 'Auto tour'; if (touring && selected) { clearSelection(); } if (touring) { closeCard(); viewAll(); } };
document.getElementById('all').onclick = () => { stopTour(); clearSelection(); showKey('welcome'); if (narrow) setMin(true); viewAll(); };
document.getElementById('flagBtn').onclick = () => { stopTour(); clearSelection(); showKey('flag'); flyFlag(); };

function resize() { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
camera.position.set(180, 200, 270); controls.target.set(0, 0, 0);
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fly) { const k = ease(Math.min(1, (now - fly.t0) / fly.ms)); controls.target.lerpVectors(fly.fT, fly.tT, k); camera.position.lerpVectors(fly.fP, fly.tP, k); if (k >= 1) fly = null; }
  if (touring) { const t = controls.target, dx = camera.position.x - t.x, dz = camera.position.z - t.z, a = dt * 0.12;
    camera.position.x = t.x + dx * Math.cos(a) - dz * Math.sin(a); camera.position.z = t.z + dx * Math.sin(a) + dz * Math.cos(a); }
  if (!reduce) flag.scale.x = 1 + Math.sin(now / 220) * 0.06;
  controls.update();
  const tg = controls.target; sun.target.position.set(Math.round(tg.x / 8) * 8, 0, Math.round(tg.z / 8) * 8); sun.position.copy(sun.target.position).add(SUN_OFF);
  renderer.render(scene, camera); updateLabels();
  requestAnimationFrame(frame);
}
document.getElementById('loading').remove();
showKey('welcome');
if (matchMedia('(max-width: 720px)').matches) setMin(true);
const narrow = matchMedia('(max-width: 720px)').matches;
setTimeout(() => selected || fly ? null : narrow ? flyTo(new THREE.Vector3(0, 5, 10), new THREE.Vector3(62, 70, 96), 1800) : flyTo(new THREE.Vector3(0, 0, 0), new THREE.Vector3(150, 160, 220), 1800), 500);
// ----- load the sheet -----
(async function load() {
  let rows = null;
  if (SHEET_CSV_URL) {
    try { const r = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' }); if (r.ok) rows = parseCSV(await r.text()); } catch (e) {}
  }
  if (!rows || !rows.length) rows = parseCSV(FALLBACK);
  buildHomes(rows);
})();

requestAnimationFrame(frame);

})();
</script>
