<style>

html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; } #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

.lbl.place { background: var(--copper); color: #f4fbf8; border-color: var(--copper); }
.lbl.sel { background: var(--terracotta); color: #fff8ef; border-color: var(--terracotta); z-index: 2; }
.topbar { position: fixed; z-index: 5; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.brand { pointer-events: auto; margin-right: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; display: grid; gap: 2px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1; }
.brand p { margin: 0; font-size: .76rem; color: var(--ink-dim); } .brand b { color: var(--terracotta); font-variant-numeric: tabular-nums; }
.search { pointer-events: auto; position: relative; width: min(320px, 100%); }
.search input { width: 100%; box-sizing: border-box; font: inherit; font-size: .92rem; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px; outline: none; }

.results button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .88rem; color: var(--ink); background: none; border: 0; padding: 10px 14px; cursor: pointer; }
.results button:hover, .results button:focus-visible { background: rgba(200,96,63,.1); outline: none; } .results span { color: var(--ink-dim); font-size: .78rem; }
.controls { position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; }
.controls button { font: inherit; font-size: .84rem; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
.controls button[aria-pressed="true"] { background: var(--copper); color: #f4fbf8; border-color: var(--copper); }

.card { position: fixed; z-index: 6; top: calc(92px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 330px; max-height: calc(100% - 120px); overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.eyebrow { margin: 0; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.title { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.05; text-wrap: balance; word-break: break-word; }

.p { margin: 0; font-size: .88rem; line-height: 1.55; color: var(--ink-dim); }

.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

@media (max-width: 720px) { .card { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 40%; border-radius: 20px 20px 0 0;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .controls { bottom: calc(40% + 12px); } .toast { bottom: calc(40% + 64px); } }
.card { gap: 10px; }

.card .body { display: grid; gap: 12px; }
.card.min .body { display: none; }
.card.min .title { font-size: 1.15rem; }
.iconbtn { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 1.15rem/1 var(--body); cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { background: rgba(200,96,63,.1); }

.infobtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.empty-res { display: grid; gap: 4px; padding: 12px 14px; font-size: .86rem; } .empty-res span { color: var(--ink-dim); line-height: 1.45; }
@media (max-width: 720px) { .card.min { max-height: none; } .card.min ~ .controls { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); } .card[hidden] ~ .controls { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); } .infobtn { bottom: calc(74px + env(safe-area-inset-bottom, 0px)); } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
if (!window.THREE) { document.getElementById('loading').textContent = 'The 3D map could not load. Refresh to try again.'; return; }
const wrap = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8e4d8');
scene.fog = new THREE.Fog('#e8e4d8', 230, 620);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 2500);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.45; controls.minDistance = 14; controls.maxDistance = 380; controls.screenSpacePanning = false;
scene.add(new THREE.HemisphereLight('#fff3df', '#7a6a50', 0.55));
const sun = new THREE.DirectionalLight('#ffe0b4', 0.85);
sun.position.set(-110, 170, 130); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -140, right: 140, top: 140, bottom: -140, near: 10, far: 600 }); sun.shadow.bias = -0.0006;
scene.add(sun);
// ---------- illustrated look: toon shading + ink outlines ----------
const grad = new THREE.DataTexture(new Uint8Array([105, 165, 215]), 3, 1, THREE.LuminanceFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const cache = {};
const mat = c => cache[c] || (cache[c] = new THREE.MeshToonMaterial({ color: c, gradientMap: grad }));
const ink = new THREE.LineBasicMaterial({ color: '#3a2a20', transparent: true, opacity: 0.55 });
const outlines = [];
function edge(mesh) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 25), ink); mesh.add(l); outlines.push(l); }
function add(parent, geo, m, x, y, z, o = {}) {
  const mesh = new THREE.Mesh(geo, typeof m === 'string' ? mat(m) : m);
  mesh.position.set(x, y, z); if (o.ry) mesh.rotation.y = o.ry; if (o.rx) mesh.rotation.x = o.rx; if (o.rz) mesh.rotation.z = o.rz;
  mesh.castShadow = o.shadow !== false; mesh.receiveShadow = true; if (o.edge !== false) edge(mesh); parent.add(mesh); return mesh;
}
const B = (p, w, h, d, m, x, y, z, o) => add(p, new THREE.BoxGeometry(w, h, d), m, x, y + h / 2, z, o);
const C = { sand: '#e8d5b0', sand2: '#d9c49a', white: '#f6f0e2', terra: '#c8603f', terra2: '#b5543a', copper: '#4f9a86', glass: '#3f5866', glassWarm: '#f0c36a',
  shutter: '#47684a', wood: '#7a4f34', iron: '#2f2b28', grass: '#86ab5c', grass2: '#76a052', leaf: '#4f8a42', leaf2: '#5e9a4e', cypress: '#3d6b3a', pink: '#d88fb0', purple: '#a084c8', water: '#5ab4d0', cream: '#f7ecd6', teal: '#3f8f8a' };

function gable(p, w, h, d, m, x, y, z, ry = 0) {
  const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false }); g.translate(0, 0, -d / 2);
  return add(p, g, m, x, y, z, { ry });
}
function hip(p, w, h, d, m, x, y, z) {
  const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); g.rotateY(Math.PI / 4); g.translate(0, 0.5, 0); g.scale(w, h, d);
  return add(p, g, m, x, y, z);
}
function dome(p, r, m, x, y, z) {
  const d = add(p, new THREE.SphereGeometry(r, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), m, x, y, z);
  B(p, r * 0.12, r * 0.9, r * 0.12, C.iron, x, y + r * 0.95, z, { edge: false });
  add(p, new THREE.SphereGeometry(r * 0.13, 10, 8), C.copper, x, y + r * 1.9, z, { edge: false });
  return d;
}
// window facing +z of its group; rotate the group to put it on other faces
function win(p, x, y, z, ry, w = 1.1, h = 1.5, o = {}) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; p.add(g);
  B(g, w + 0.3, h + w / 2 + 0.25, 0.08, C.sand2, 0, -0.12, 0.02, { shadow: false });
  B(g, w, h, 0.1, o.warm ? C.glassWarm : C.glass, 0, 0, 0.06, { shadow: false, edge: false });
  const a = new THREE.CylinderGeometry(w / 2, w / 2, 0.1, 16, 1, false, Math.PI / 2, Math.PI); a.rotateX(Math.PI / 2);
  add(g, a, o.warm ? C.glassWarm : C.glass, 0, h, 0.06, { shadow: false, edge: false });
  if (o.shutters !== false) { B(g, w * 0.5, h, 0.06, C.shutter, -w * 0.78, 0, 0.1, { shadow: false }); B(g, w * 0.5, h, 0.06, C.shutter, w * 0.78, 0, 0.1, { shadow: false }); }
  return g;
}
function door(p, x, y, z, ry, w = 1.3, h = 2.1) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; p.add(g);
  B(g, w + 0.35, h + w / 2 + 0.2, 0.08, C.sand2, 0, 0, 0.02, { shadow: false });
  B(g, w, h, 0.12, C.wood, 0, 0, 0.06, { shadow: false });
  const a = new THREE.CylinderGeometry(w / 2, w / 2, 0.12, 16, 1, false, Math.PI / 2, Math.PI); a.rotateX(Math.PI / 2);
  add(g, a, C.wood, 0, h, 0.06, { shadow: false, edge: false });
}
function rail(p, w, x, y, z, ry = 0, h = 0.9) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; p.add(g);
  B(g, w, 0.08, 0.08, C.iron, 0, h, 0, { edge: false, shadow: false });
  for (let i = 0; i <= Math.round(w / 0.35); i++) B(g, 0.05, h, 0.05, C.iron, -w / 2 + i * w / Math.round(w / 0.35), 0, 0, { edge: false, shadow: false });
}
function balcony(p, w, dp, x, y, z, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; p.add(g);
  B(g, w, 0.22, dp, C.sand2, 0, 0, dp / 2);
  rail(g, w, 0, 0.22, dp - 0.05); rail(g, dp, -w / 2 + 0.04, 0.22, dp / 2, Math.PI / 2); rail(g, dp, w / 2 - 0.04, 0.22, dp / 2, Math.PI / 2);
  return g;
}
function pot(p, x, y, z, s = 1, flower) {
  B(p, 0.5 * s, 0.45 * s, 0.5 * s, C.terra2, x, y, z, { edge: false });
  add(p, new THREE.IcosahedronGeometry(0.42 * s, 0), flower ? C.pink : C.leaf2, x, y + 0.7 * s, z, { edge: false });
}
function tree(p, x, y, z, kind = 'canopy', s = 1) {
  if (kind === 'cypress') { B(p, 0.25 * s, 0.6 * s, 0.25 * s, C.wood, x, y, z, { edge: false }); add(p, new THREE.ConeGeometry(0.9 * s, 5 * s, 7), C.cypress, x, y + 3 * s, z); return; }
  add(p, new THREE.CylinderGeometry(0.18 * s, 0.26 * s, 2.4 * s, 6), C.wood, x, y + 1.2 * s, z, { edge: false });
  const col = kind === 'pink' ? C.pink : kind === 'purple' ? C.purple : C.leaf;
  add(p, new THREE.IcosahedronGeometry(1.7 * s, 1), col, x, y + 3.3 * s, z);
  add(p, new THREE.IcosahedronGeometry(1.1 * s, 0), kind === 'canopy' ? C.leaf2 : col, x + 0.9 * s, y + 3.9 * s, z + 0.4 * s, { edge: false });
}
function hedge(p, w, d, x, z) { B(p, w, 0.9, d, C.leaf, x, 0.2, z); }
function lamp(p, x, z) { B(p, 0.12, 3.2, 0.12, C.iron, x, 0.2, z, { edge: false }); add(p, new THREE.SphereGeometry(0.28, 10, 8), new THREE.MeshBasicMaterial({ color: '#ffd98a' }), x, 3.55, z, { edge: false, shadow: false }); }
function car(p, x, z, ry, col) { const g = new THREE.Group(); g.position.set(x, 0.2, z); g.rotation.y = ry; p.add(g);
  B(g, 1.8, 0.8, 4, col, 0, 0.35, 0); B(g, 1.6, 0.7, 2, C.glass, 0, 1.15, -0.2);
  [[-0.9, 1.3], [0.9, 1.3], [-0.9, -1.3], [0.9, -1.3]].forEach(([a, b]) => add(g, new THREE.CylinderGeometry(0.38, 0.38, 0.3, 12), C.iron, a, 0.38, b, { rz: Math.PI / 2, edge: false })); }
function stoneWall(p, x1, z1, x2, z2, h = 0.7) {
  const len = Math.hypot(x2 - x1, z2 - z1); B(p, len, h, 0.35, C.sand2, (x1 + x2) / 2, 0.2, (z1 + z2) / 2, { ry: Math.atan2(-(z2 - z1), x2 - x1) });
}
function pad(p, w, d) { B(p, w, 0.2, d, C.grass, 0, 0, 0, { shadow: false }); }
function wallMat(c) { return new THREE.MeshToonMaterial({ color: c, gradientMap: grad }); }

// ================= DAY 0 MAP: empty land, one flag, no buildings =================
const pickables = [];
// endless land: one big ground that fades into fog, so nobody sees where it ends
const groundG = new THREE.PlaneGeometry(6000, 6000, 120, 120); groundG.rotateX(-Math.PI / 2);
{ const gp = groundG.attributes.position, gc = [], c1 = new THREE.Color('#7fa457'), c2 = new THREE.Color('#6e9a4a');
  for (let i = 0; i < gp.count; i++) { const x = gp.getX(i), z = gp.getZ(i), n = (Math.sin(x * 0.013) * Math.cos(z * 0.011) + Math.sin((x + z) * 0.007)) * 0.25 + 0.5;
    const c = c1.clone().lerp(c2, n); gc.push(c.r, c.g, c.b); }
  groundG.setAttribute('color', new THREE.Float32BufferAttribute(gc, 3)); }
const ground = new THREE.Mesh(groundG, new THREE.MeshLambertMaterial({ vertexColors: true })); ground.receiveShadow = true; ground.userData.place = 'land'; scene.add(ground); pickables.push(ground);
const meadow = new THREE.Mesh(new THREE.CircleGeometry(70, 64), mat('#87ad5c')); meadow.rotation.x = -Math.PI / 2; meadow.position.y = 0.03; meadow.receiveShadow = true; meadow.userData.place = 'centre'; scene.add(meadow); pickables.push(meadow);

const spots = []; let sd = 9; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 90000 && spots.length < 7000; i++) {
  const x = (rnd() - 0.5) * 1700, z = (rnd() - 0.5) * 1700;
  const d = Math.hypot(x, z); if (d > 850) continue; if (d < 62) continue; if (d < 130 && rnd() > 0.35) continue;
  spots.push([x, z, 0.8 + rnd() * 0.7, rnd()]);
}
const cr = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.3, 0), new THREE.MeshToonMaterial({ color: '#ffffff', gradientMap: grad }), spots.length);
const tk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 2.4, 6), mat(C.wood), spots.length);
const o3 = new THREE.Object3D(), TC = ['#4f8a42', '#5e9a4e', '#467f3c', '#3d6b3a', '#d88fb0', '#a084c8'];
spots.forEach(([x, z, s, r], i) => { o3.position.set(x, 1.2 * s, z); o3.scale.set(s, s, s); o3.rotation.set(0, r * 6, 0); o3.updateMatrix(); tk.setMatrixAt(i, o3.matrix);
  o3.position.y = 3.6 * s; o3.scale.set(s, s * 1.2, s); o3.updateMatrix(); cr.setMatrixAt(i, o3.matrix); cr.setColorAt(i, new THREE.Color(TC[r < 0.05 ? 4 : r < 0.09 ? 5 : Math.floor(r * 4)])); });
cr.castShadow = true; tk.castShadow = true; cr.userData.place = 'forest'; scene.add(cr, tk); pickables.push(cr);

const flagG = new THREE.Group(); scene.add(flagG);
add(flagG, new THREE.CylinderGeometry(5, 5.4, 0.6, 40), C.sand, 0, 0.3, 0);
add(flagG, new THREE.CylinderGeometry(2.4, 2.6, 0.5, 32), C.sand2, 0, 0.85, 0);
add(flagG, new THREE.CylinderGeometry(0.16, 0.2, 14, 10), C.iron, 0, 8, 0, { edge: false });
add(flagG, new THREE.SphereGeometry(0.4, 12, 8), '#e2b04a', 0, 15.2, 0, { edge: false });
const flag = B(flagG, 5.2, 3.2, 0.1, C.terra, 2.75, 11.6, 0, { edge: false });
for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; B(flagG, 0.6, 0.8, 0.6, C.sand2, Math.cos(a) * 4.4, 0.4, Math.sin(a) * 4.4); }
flagG.traverse(o => { if (o.isMesh) { o.userData.place = 'flag'; pickables.push(o); } });

// ---------- labels ----------
const labelsEl = document.getElementById('labels');
const flagLbl = document.createElement('div'); flagLbl.className = 'lbl place'; flagLbl.textContent = 'The first flag'; labelsEl.appendChild(flagLbl);
const flagPos = new THREE.Vector3(0, 18, 0), vv = new THREE.Vector3();
function updateLabels() { vv.copy(flagPos).project(camera); const on = vv.z < 1 && Math.abs(vv.x) < 1 && Math.abs(vv.y) < 1;
  flagLbl.hidden = !on; if (on) { flagLbl.style.left = ((vv.x + 1) / 2 * wrap.clientWidth) + 'px'; flagLbl.style.top = ((1 - vv.y) / 2 * wrap.clientHeight) + 'px'; } }

// ---------- card: open, minimise, close ----------
const card = document.getElementById('card'), cardEye = document.getElementById('cardEye'), cardTitle = document.getElementById('cardTitle'), cardBody = document.getElementById('cardBody');
const minBtn = document.getElementById('minBtn'), closeBtn = document.getElementById('closeBtn'), infoBtn = document.getElementById('infoBtn');
function setMin(m) { card.classList.toggle('min', m); minBtn.setAttribute('aria-expanded', String(!m)); minBtn.setAttribute('aria-label', m ? 'Show details' : 'Hide details'); minBtn.textContent = m ? '+' : '−'; }
function openCard() { card.hidden = false; infoBtn.hidden = true; setMin(false); }
minBtn.onclick = () => setMin(!card.classList.contains('min'));
closeBtn.onclick = () => { card.hidden = true; infoBtn.hidden = false; };
infoBtn.onclick = () => { openCard(); };
function show(eye, title, body) { cardEye.textContent = eye; cardTitle.textContent = title; cardBody.innerHTML = body; openCard(); }
const CONTENT = {
  welcome: ['Day 0 · 0 citizens', 'A country with no one in it yet',
    `<p class="p">Forest in every direction, and fog beyond it. Nobody has explored that far yet. There is only one flag in the middle, and nothing else is built.</p>
     <p class="p">Every person who follows becomes a citizen, and their home appears on this map with their Instagram name on it.</p>
     <dl class="facts"><dt>Citizens</dt><dd>0</dd><dt>Homes</dt><dd>0</dd><dt>Buildings</dt><dd>0</dd></dl>
     <a class="btn" href="https://www.instagram.com/buildacountry/" target="_blank" rel="noopener">Follow @buildacountry</a>`],
  flag: ['Day 0 · city centre', 'The first flag',
    `<p class="p">This is where the country begins. The first homes will be built around this flag.</p>
     <p class="p">Follow the page to become one of the first citizens.</p>
     <a class="btn" href="https://www.instagram.com/buildacountry/" target="_blank" rel="noopener">Follow @buildacountry</a>`],
  centre: ['City centre', 'Empty land around the flag',
    `<p class="p">Nobody lives here yet. The first followers get their homes on this land, closest to the flag.</p>`],
  forest: ['The forest', 'Untouched forest',
    `<p class="p">Most of the country is still forest. As more people join, new areas will open up here.</p>`],
  land: ['Unexplored land', 'Beyond the fog',
    `<p class="p">Nobody knows how far the land goes yet. The fog clears as the country grows and more citizens join.</p>`],
  coast: ['The coast', 'A long, empty beach',
    `<p class="p">No one has built anything by the sea yet.</p>`],
  sea: ['The sea', 'The edge of our country',
    `<p class="p">For now, the land ends here. It grows as the country grows.</p>`],

};
function showKey(k) { const c = CONTENT[k] || CONTENT.land; show(c[0], c[1], c[2]); }

// ---------- picking ----------
const ray = new THREE.Raycaster(), m2 = new THREE.Vector2(); let down = null, hoverFlag = false;
function pickAt(cx, cy) { const r = renderer.domElement.getBoundingClientRect(); m2.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1);
  ray.setFromCamera(m2, camera); const hit = ray.intersectObjects(pickables, false)[0]; return hit ? hit.object.userData.place : null; }
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || e.buttons) return; const p = pickAt(e.clientX, e.clientY); hoverFlag = p === 'flag'; renderer.domElement.style.cursor = hoverFlag ? 'pointer' : 'grab'; });
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; fly = null; stopTour(); });
renderer.domElement.addEventListener('pointerup', e => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const p = pickAt(e.clientX, e.clientY); if (!p) return; showKey(p); if (p === 'flag') flyFlag(); });

// ---------- camera ----------
let fly = null, touring = false;
function flyTo(t, off, ms = 1200) { fly = { t0: performance.now(), ms, fT: controls.target.clone(), tT: t, fP: camera.position.clone(), tP: t.clone().add(off) }; }
const viewAll = () => flyTo(new THREE.Vector3(0, 0, 0), new THREE.Vector3(180, 200, 270), 1400);
const flyFlag = () => flyTo(new THREE.Vector3(0, 6, 0), new THREE.Vector3(32, 22, 42));

// ---------- search ----------
const q = document.getElementById('q'), res = document.getElementById('results');
q.addEventListener('input', () => { const s = q.value.trim().replace(/^@/, '');
  if (!s) { res.hidden = true; return; }
  res.innerHTML = `<div class="empty-res"><b>No citizens yet</b><span>The country is on Day 0. Follow <a href="https://www.instagram.com/buildacountry/" target="_blank" rel="noopener">@buildacountry</a> and your home appears here first.</span></div>`; res.hidden = false; });
q.addEventListener('keydown', e => { if (e.key === 'Escape') { res.hidden = true; q.blur(); } });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) res.hidden = true; });

const tourBtn = document.getElementById('tour');
function stopTour() { touring = false; tourBtn.setAttribute('aria-pressed', 'false'); }
tourBtn.onclick = () => { touring = !touring; tourBtn.setAttribute('aria-pressed', String(touring)); fly = null; };
document.getElementById('all').onclick = () => { stopTour(); showKey('welcome'); viewAll(); };
document.getElementById('flagBtn').onclick = () => { stopTour(); showKey('flag'); flyFlag(); };

function resize() { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
camera.position.set(180, 200, 270); controls.target.set(0, 0, 0);
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fly) { const k = ease(Math.min(1, (now - fly.t0) / fly.ms)); controls.target.lerpVectors(fly.fT, fly.tT, k); camera.position.lerpVectors(fly.fP, fly.tP, k); if (k >= 1) fly = null; }
  if (touring) { const t = controls.target, dx = camera.position.x - t.x, dz = camera.position.z - t.z, a = dt * 0.12;
    camera.position.x = t.x + dx * Math.cos(a) - dz * Math.sin(a); camera.position.z = t.z + dx * Math.sin(a) + dz * Math.cos(a); }
  if (!reduce) flag.scale.x = 1 + Math.sin(now / 220) * 0.06;
  controls.update(); renderer.render(scene, camera); updateLabels();
  requestAnimationFrame(frame);
}
document.getElementById('loading').remove();
showKey('welcome');
if (matchMedia('(max-width: 720px)').matches) setMin(true);
setTimeout(() => flyTo(new THREE.Vector3(0, 0, 0), new THREE.Vector3(150, 160, 220), 1800), 500);
requestAnimationFrame(frame);

})();
</script>
