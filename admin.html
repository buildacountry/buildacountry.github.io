<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Vinland Admin</title>
<style>
:root{--ink:#1f2a3d;--mute:#7a7266;--bg:#f6f0e2;--card:#fffaf0;--rule:#e2d6b8;--navy:#14233f;--green:#2f7a68;--red:#c2552d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px max(16px,env(safe-area-inset-left))}
h1{font:700 22px Georgia,serif;margin:0 0 12px}h2{font:700 17px Georgia,serif;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px;margin-bottom:10px;max-width:720px}
.by{font-size:12px;color:var(--mute)}textarea,input{width:100%;font:15px system-ui;border:1px solid var(--rule);border-radius:8px;padding:9px;background:#fff;color:var(--ink)}
textarea{min-height:70px;margin-top:8px}button{font:600 14px system-ui;border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;cursor:pointer;margin:8px 6px 0 0}
button.g{background:var(--green)}button.r{background:var(--red)}button.l{background:#e8dfc8;color:var(--ink)}.ok{color:var(--green);font-weight:600}.tabs button{background:#e8dfc8;color:var(--ink)}.tabs button.on{background:var(--navy);color:#fff}
.reply{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);white-space:pre-wrap}
</style></head><body>
<h1>Vinland Admin</h1>
<div id="login" class="card"><b>Admin password</b><p class="by">The ADMIN_KEY you set in Supabase → Edge Functions → Secrets. It stays on this device only.</p><input id="key" type="password" autocomplete="current-password"><button id="go">Open</button><p id="lerr" class="by"></p></div>
<div id="app" hidden>
  <div class="tabs"><button data-t="asks" class="on">Questions</button><button data-t="reqs">Requests</button><button id="out" class="l">Log out</button></div>
  <div id="body"></div>
</div>
<script>
const URL_ = 'https://whhohzvvxhzpcsdcyuks.supabase.co/functions/v1/social', $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let KEY = ''; try { KEY = sessionStorage.getItem('vin_admin') || ''; } catch (e) {}
let D = { asks: [], open: [], done: [] }, T = 'asks';
const api = b => fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'admin', key: KEY, ...b }) }).then(r => r.json());
async function load() { const r = await api({ do: 'inbox' }).catch(() => null); if (!r || !r.ok) { $('#app').hidden = true; $('#login').hidden = false; $('#lerr').textContent = r && r.error === 'not admin' ? 'Wrong password (or ADMIN_KEY is not set yet).' : 'Could not reach the server.'; return; }
  D = r; $('#login').hidden = true; $('#app').hidden = false; draw(); }
function draw() {
  document.querySelectorAll('.tabs [data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === T));
  if (T === 'asks') { const open = D.asks.filter(a => !a.replied_at), done = D.asks.filter(a => a.replied_at);
    $('#body').innerHTML = `<h2>Waiting for an answer (${open.length})</h2>` + (open.map(a => `<div class="card"><div class="by">@${esc(a.username)} · ${new Date(a.created_at).toLocaleString()}</div><div>${esc(a.text)}</div><textarea id="r${a.id}" placeholder="Your answer (no links, no prices)"></textarea><button class="g" data-a="reply" data-id="${a.id}">Send answer</button></div>`).join('') || '<p class="by">All answered 🎉</p>')
      + `<h2>Answered (${done.length})</h2>` + done.slice(0, 60).map(a => `<div class="card"><div class="by">@${esc(a.username)}</div><div>${esc(a.text)}</div><div class="reply"><span class="ok">You:</span> ${esc(a.reply)}</div></div>`).join(''); }
  else $('#body').innerHTML = `<h2>Open requests (${D.open.length})</h2>` + D.open.map(r => `<div class="card"><div class="by">@${esc(r.username)} · ${r.supports} support</div><div><b>${esc(r.text)}</b></div><input id="n${r.id}" placeholder="Note when built (e.g. Built on Day 30, in the Suburb)"><button class="g" data-a="st" data-s="done" data-id="${r.id}">Mark built</button><button class="r" data-a="st" data-s="hidden" data-id="${r.id}">Hide</button></div>`).join('')
      + `<h2>Built (${D.done.length})</h2>` + D.done.map(r => `<div class="card"><div class="by">@${esc(r.username)} · ${r.supports} support</div><div>${esc(r.text)}</div><div class="by ok">${esc(r.note || '')}</div><button class="l" data-a="st" data-s="open" data-id="${r.id}">Reopen</button></div>`).join('');
}
$('#go').onclick = () => { KEY = $('#key').value.trim(); try { sessionStorage.setItem('vin_admin', KEY); } catch (e) {} load(); };
$('#out').onclick = () => { KEY = ''; try { sessionStorage.removeItem('vin_admin'); } catch (e) {} location.reload(); };
document.addEventListener('click', async e => { const b = e.target.closest('[data-t],[data-a]'); if (!b) return;
  if (b.dataset.t) { T = b.dataset.t; draw(); return; }
  const id = +b.dataset.id; b.disabled = true;
  if (b.dataset.a === 'reply') { const t = $('#r' + id).value.trim(); if (!t) { b.disabled = false; return; } const r = await api({ do: 'reply', id, text: t }); if (r.ok) load(); else { b.disabled = false; b.textContent = 'Could not save, try again'; } }
  if (b.dataset.a === 'st') { const n = $('#n' + id), r = await api({ do: 'req_status', id, status: b.dataset.s, note: n ? n.value : '' }); if (r.ok) load(); else b.disabled = false; }
});
if (KEY) load();
</script></body></html>
