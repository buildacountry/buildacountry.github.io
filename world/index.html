<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fd3ea">
<title>Vinland · world preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VINLAND WORLD PREVIEW v3 (26 Nov): the real layout with the map's own homes, landmarks and street pieces (map/kit.js),
   Kenney citizens, and little troubles to solve. Built to stay smooth on phones: everything instanced, near/far homes,
   no real-time shadows. Landscape on phones. */
:root{--chip:rgba(255,253,247,.94);--ink:#2b2a33;--teal:#1f8a8a;--red:#d9553f;--gold:#f0b429}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f0;font:16px/1.35 "Baloo 2",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.chip{position:fixed;background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 13px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12);z-index:3;border:0;font-family:inherit;font-size:15px;display:flex;align-items:center;gap:7px}
#brand{top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left))}
#brand small{font-weight:600;opacity:.6}
#coins{top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,#f0b429 60%,#c98a12)}
#home{top:calc(50px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));cursor:pointer;min-height:36px;font-size:14px}
#fps{bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;padding:2px 9px;opacity:.75}
#quest{top:calc(50px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));max-width:min(46vw,340px);border-radius:14px;font-size:13px;font-weight:600;display:none;line-height:1.25;padding:7px 12px}
#quest b{color:var(--red)}
#stick{position:fixed;left:calc(24px + env(safe-area-inset-left));bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,253,247,.3);border:3px solid rgba(255,253,247,.85);z-index:3;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--chip)}
.btn{position:fixed;border:0;border-radius:999px;font:inherit;font-weight:800;z-index:3;cursor:pointer}
#run{right:calc(26px + env(safe-area-inset-right));bottom:26px;width:68px;height:68px;background:#1f8a8a;color:#fff;font-size:15px;box-shadow:0 4px 0 #136060}
#run[aria-pressed=true]{background:#f0b429;color:#2b2a33;box-shadow:0 4px 0 #a07510}
#act{right:calc(104px + env(safe-area-inset-right));bottom:34px;min-width:110px;height:56px;padding:0 18px;background:var(--red);color:#fff;font-size:17px;box-shadow:0 4px 0 #a33a28;display:none}
#act:active,#run:active{transform:translateY(3px)}
.tag{position:fixed;left:0;top:0;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;z-index:2;will-change:transform}
.tag.place{background:#1f8a8a;color:#fff;font-size:13px}
.tag.mine{background:var(--red);color:#fff}
.tag.npc{background:rgba(255,253,247,.85);font-size:11px;font-weight:600}
.tag.say{background:#fff;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:600;white-space:normal;max-width:190px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tag.bang{background:var(--gold);color:#2b2a33;font-size:18px;padding:0 10px;border-radius:10px}
.tag.goal{background:var(--red);color:#fff;font-size:14px}
.pop{position:fixed;left:50%;top:40%;font-weight:800;font-size:28px;color:#f0b429;text-shadow:0 2px 0 #7a5208;pointer-events:none;z-index:4;transition:transform 1.1s ease-out,opacity 1.1s;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--chip);border-radius:14px;padding:6px 14px;font-weight:600;font-size:14px;z-index:5;opacity:0;transition:opacity .3s;text-align:center;max-width:min(60vw,440px)}
#toast.on{opacity:1}
#panel{position:fixed;inset:0;display:none;place-items:center;z-index:6;background:rgba(20,30,50,.35)}
#panel.on{display:grid}
#panel form{background:#fffdf7;border-radius:20px;padding:16px;width:min(92vw,360px)}
#panel h3{margin:0 0 8px;font-size:19px}
#panel input{width:100%;font:inherit;font-size:17px;padding:9px 12px;border-radius:12px;border:2px solid #e6dccb;background:#fff}
#panel .row{display:flex;gap:8px;margin-top:10px}
#panel button{flex:1;min-height:44px;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
#panel .go{background:var(--red);color:#fff}
#panel p{margin:8px 0 0;font-size:14px;min-height:1.4em}
#load{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:linear-gradient(#9fd3ea,#e9f6f2);font-weight:800;font-size:22px;text-align:center;transition:opacity .4s}
#load small{display:block;font-weight:600;font-size:14px;opacity:.7}
#rotate{position:fixed;inset:0;z-index:8;display:none;place-items:center;background:#9fd3ea;text-align:center;font-weight:800;font-size:22px;padding:24px}
#rotate small{display:block;font-weight:600;font-size:15px;opacity:.75;margin-top:6px}
#rotate .ph{width:70px;height:110px;border:6px solid #2b2a33;border-radius:14px;margin:0 auto 18px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (hover:none) and (pointer:coarse){#rotate{display:grid}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none}#load,.pop,#toast{transition:none}}
</style>
</head>
<body>
<div id="load"><div>Building Vinland…<small id="lt">Laying roads, homes and streets</small></div></div>
<div id="rotate"><div><div class="ph"></div>Turn your phone sideways<small>Vinland plays in landscape</small></div></div>
<div class="chip" id="brand">Vinland <small>world preview</small></div>
<div class="chip" id="coins"><span class="coin"></span><span id="cv">100</span></div>
<button class="chip" id="home">Go to my home</button>
<div class="chip" id="quest"></div>
<div class="chip" id="fps">…</div>
<div id="stick"><div id="knob"></div></div>
<button class="btn" id="act">Talk</button>
<button class="btn" id="run" aria-pressed="false">Run</button>
<div id="tags"></div><div id="toast"></div>
<div id="panel"><form><h3>Find your home</h3><input id="who" placeholder="your Instagram name" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row"><button type="button" id="cancel">Close</button><button class="go">Take me there</button></div><p id="msg"></p></form></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../vinland-static.js"></script>
<script src="../map/mapdata.js"></script>
<script src="../map/kit.js"></script>
<script src="../map/kenney/glb.js"></script>
<script>
{
const T = THREE, S = window.VIN_STATIC, MD = window.VIN_MAPDATA, K = window.VinlandKit;
const PHONE = matchMedia('(hover: none) and (pointer: coarse)').matches;
const renderer = new T.WebGLRenderer({ antialias: !PHONE, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, PHONE ? 1.25 : 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 650);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
scene.fog = new T.Fog(0xd6ecf2, 170, 500); scene.background = new T.Color(0xbfe6f0);
scene.add(new T.HemisphereLight(0xfff6e8, 0x8a7a64, 0.75));
const sun = new T.DirectionalLight(0xfff0dc, 0.6); sun.position.set(-40, 90, 60); scene.add(sun);
const grad = new T.DataTexture(new Uint8Array([105, 165, 215]), 3, 1, T.LuminanceFormat); grad.minFilter = grad.magFilter = T.NearestFilter; grad.needsUpdate = true;
const toon = c => new T.MeshToonMaterial({ color: c, gradientMap: grad });
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const M4 = new T.Matrix4(), Q = new T.Quaternion(), V3 = new T.Vector3(), ONE = new T.Vector3(1, 1, 1), UP = new T.Vector3(0, 1, 0), COL = new T.Color();
const mat = (x, z, ang, s = 1) => new T.Matrix4().compose(new T.Vector3(x, 0, z), new T.Quaternion().setFromAxisAngle(UP, ang), new T.Vector3(s, s, s));

// ---------- the map's own designs, baked once and drawn as instances (a few draw calls per design) ----------
// Each design is merged into ONE mesh per face side (plain colours baked into the vertices). Up to two colour slots
// (wall + roof, body, canopy…) stay tintable per copy through two small per-instance colours. Only textured or
// see-through pieces stay separate. A house goes from ~17 draws to 1.
const designs = {};
const mergedMats = {};
function mergedMat(side) { if (mergedMats[side]) return mergedMats[side]; const m = new T.MeshToonMaterial({ vertexColors: true, gradientMap: grad, side });
  m.onBeforeCompile = s => { s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nattribute float sl;\nattribute vec3 tA;\nattribute vec3 tB;')
    .replace('#include <color_vertex>', '#include <color_vertex>\nif (sl > 0.5) vColor = sl < 1.5 ? tA : tB;'); };
  return (mergedMats[side] = m); }
function design(key, cap, o = {}) { const id = key + ':' + cap + ':' + JSON.stringify(o); if (designs[id]) return designs[id]; const baked = K.bake(K.make(key, o));
  const slots = [], groups = {}, parts = [];
  for (const pt of baked.parts) {
    if (pt.map || pt.transparent || pt.basic) { const m = pt.basic ? new T.MeshBasicMaterial({ color: 0xffffff }) : toon(0xffffff); if (pt.map) m.map = pt.map; m.side = pt.side; if (pt.transparent) { m.transparent = true; m.opacity = pt.opacity; m.depthWrite = false; }
      const im = new T.InstancedMesh(pt.geo, m, cap); im.instanceColor = new T.InstancedBufferAttribute(new Float32Array(cap * 3).fill(1), 3); im.count = 0; im.frustumCulled = false; im.visible = false; scene.add(im); parts.push({ pt, im }); continue; }
    let si = 0; if (pt.slot) { if (!slots.includes(pt.slot) && slots.length < 2) slots.push(pt.slot); si = slots.indexOf(pt.slot) + 1; }
    (groups[pt.side] = groups[pt.side] || []).push([pt, si]); }
  const merged = [];
  for (const side in groups) { const list = groups[side]; let n = 0; list.forEach(([pt]) => n += pt.geo.attributes.position.count);
    const P = new Float32Array(n * 3), N = new Float32Array(n * 3), C = new Float32Array(n * 3), SL = new Float32Array(n); let o2 = 0;
    for (const [pt, si] of list) { const c = pt.geo.attributes.position.count; P.set(pt.geo.attributes.position.array, o2 * 3); N.set(pt.geo.attributes.normal.array, o2 * 3); for (let i = 0; i < c; i++) { C[(o2 + i) * 3] = pt.color.r; C[(o2 + i) * 3 + 1] = pt.color.g; C[(o2 + i) * 3 + 2] = pt.color.b; SL[o2 + i] = si; } o2 += c; }
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(P, 3)); g.setAttribute('normal', new T.BufferAttribute(N, 3)); g.setAttribute('color', new T.BufferAttribute(C, 3)); g.setAttribute('sl', new T.BufferAttribute(SL, 1));
    const defA = list.find(([, si]) => si === 1), defB = list.find(([, si]) => si === 2);
    const tA = new T.InstancedBufferAttribute(new Float32Array(cap * 3), 3), tB = new T.InstancedBufferAttribute(new Float32Array(cap * 3), 3); g.setAttribute('tA', tA); g.setAttribute('tB', tB);
    const im = new T.InstancedMesh(g, mergedMat(+side), cap); im.count = 0; im.frustumCulled = false; im.visible = false; scene.add(im);
    merged.push({ im, tA, tB, defA: defA ? defA[0].color : COL.clone(), defB: defB ? defB[0].color : COL.clone() }); }
  return (designs[id] = { parts, merged, slots, n: 0 }); }
function place(D, k, m, tint) {
  for (const { pt, im } of D.parts) { im.setMatrixAt(k, m); const c = tint && pt.slot && tint[pt.slot]; im.setColorAt(k, c ? COL.set(c) : pt.color); }
  const a = tint && tint[D.slots[0]], b = tint && tint[D.slots[1]];
  for (const g of D.merged) { g.im.setMatrixAt(k, m); (a ? COL.set(a) : COL.copy(g.defA)).toArray(g.tA.array, k * 3); (b ? COL.set(b) : COL.copy(g.defB)).toArray(g.tB.array, k * 3); } }
function commit(D, n) { D.n = n;
  for (const { im } of D.parts) { im.count = n; im.visible = n > 0; im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true; }
  for (const g of D.merged) { g.im.count = n; g.im.visible = n > 0; g.im.instanceMatrix.needsUpdate = true; g.tA.needsUpdate = true; g.tB.needsUpdate = true; } }
function scatter(key, list, o) { if (!list.length || !K[key]) return null; const D = design(key, list.length, o); list.forEach((it, i) => place(D, i, it.m || mat(it.x, it.z, it.a || 0, it.s || 1), it.tint)); commit(D, list.length); return D; }

// ---------- ground + roads + parks (merged: one mesh each) ----------
function part(geo, x, y, z, c) { const g = geo.index ? geo.toNonIndexed() : geo.clone(); g.translate(x, y, z); g.deleteAttribute('uv'); COL.set(c); const n = g.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) a.set([COL.r, COL.g, COL.b], i * 3); g.setAttribute('color', new T.BufferAttribute(a, 3)); return g; }
function merge(list) { let n = 0; list.forEach(g => n += g.attributes.position.count); const P = new Float32Array(n * 3), N = new Float32Array(n * 3), C = new Float32Array(n * 3); let o = 0;
  list.forEach(g => { g.computeVertexNormals(); P.set(g.attributes.position.array, o * 3); N.set(g.attributes.normal.array, o * 3); C.set(g.attributes.color.array, o * 3); o += g.attributes.position.count; });
  const m = new T.BufferGeometry(); m.setAttribute('position', new T.BufferAttribute(P, 3)); m.setAttribute('normal', new T.BufferAttribute(N, 3)); m.setAttribute('color', new T.BufferAttribute(C, 3)); return m; }
const BOX = (w, h, d) => new T.BoxGeometry(w, h, d);
const VC = new T.MeshToonMaterial({ vertexColors: true, gradientMap: grad });
const SHORE = S.coast ? S.coast.shore : -820, BEACH = S.coast ? S.coast.beach0 : -772;
{ const g = new T.Mesh(new T.PlaneGeometry(2600, 1400 - BEACH), toon(0x86ab5c)); g.rotation.x = -Math.PI / 2; g.position.set(80, 0, (BEACH + 1400) / 2); scene.add(g);
  const sd = new T.Mesh(new T.PlaneGeometry(2600, BEACH - SHORE + 8), toon(0xe8d5b0)); sd.rotation.x = -Math.PI / 2; sd.position.set(80, 0.02, (BEACH + SHORE) / 2); scene.add(sd);
  const sea = new T.Mesh(new T.PlaneGeometry(2600, 900), toon(0x5ab4d0)); sea.rotation.x = -Math.PI / 2; sea.position.set(80, -0.3, SHORE - 446); scene.add(sea); }
const R = MD.roads.map(([w, d, x, z]) => ({ w, d, x, z, ax: w >= d, L: Math.max(w, d), W: Math.min(w, d) }));
const inRoad = (px, pz, me, grow = 0.2) => R.some(r => r !== me && Math.abs(px - r.x) < r.w / 2 + grow && Math.abs(pz - r.z) < r.d / 2 + grow);
const at = (r, along, side) => r.ax ? [r.x + along, r.z + side] : [r.x + side, r.z + along];
const faceRoad = (r, side) => r.ax ? (side > 0 ? Math.PI : 0) : (side > 0 ? -Math.PI / 2 : Math.PI / 2);
function facing(x, z) { let best = 1e9, fx = 0, fz = 1; for (const r of R) { const cx = Math.max(r.x - r.w / 2, Math.min(x, r.x + r.w / 2)), cz = Math.max(r.z - r.d / 2, Math.min(z, r.z + r.d / 2)), d = (cx - x) ** 2 + (cz - z) ** 2; if (d < best) { best = d; fx = cx - x; fz = cz - z; } } if (Math.abs(fx) > Math.abs(fz)) fz = 0; else fx = 0; return Math.atan2(fx, fz); }
{ const parts = [];
  for (const r of R) { parts.push(part(BOX(r.w, 0.08, r.d), r.x, 0.04, r.z, 0x5b5f66));
    for (let s = -r.L / 2; s < r.L / 2; s += 2) { const len = Math.min(2, r.L / 2 - s), c = s + len / 2;
      for (const sd of [-1, 1]) { const [px, pz] = at(r, c, sd * (r.W / 2 + 0.7)); if (inRoad(px, pz, r, 1.3)) continue; parts.push(part(r.ax ? BOX(len, 0.18, 1.4) : BOX(1.4, 0.18, len), px, 0.09, pz, 0xe8dcc4)); }
      if (r.W >= 5 && Math.round(s / 2) % 3 === 0) { const [px, pz] = at(r, c, 0); if (!inRoad(px, pz, r, 0.5)) parts.push(part(r.ax ? BOX(1.3, 0.1, 0.16) : BOX(0.16, 0.1, 1.3), px, 0.07, pz, 0xf3e3b0)); } } }
  scene.add(new T.Mesh(merge(parts), VC)); }
{ const parts = []; MD.flat.forEach(([k, x, z, w, d, , c], i) => parts.push(part(BOX(w, 0.06, d), x + w / 2, (k === 'w' ? 0.04 : 0.05) + i * 0.004, z + d / 2, k === 'w' ? 0x5ab4d0 : c || (k === 'g' ? 0x93b865 : 0xd9c9a4)))); scene.add(new T.Mesh(merge(parts), VC)); }

// ---------- homes: the map's designs near you, simple shapes far away ----------
const lines = S.plots.trim().split('\n').map(l => l.split(','));
const homes = [], flats = {};
const DIST_DESIGN = a => a === 'L' ? (rnd() > 0.5 ? 'sbCottage' : 'sbHouse') : a === 'U' ? (rnd() > 0.4 ? 'sbHouse' : 'sbCottage') : 'houseStarter';
lines.forEach((p, i) => { const x = +p[0], z = +p[1]; if (p[2] === 'R') { const k = p[3] + '|' + p[4]; (flats[k] = flats[k] || { x, z, n: 0, nums: [] }).n++; flats[k].nums.push(i + 1); return; } homes.push({ num: i + 1, x, z, area: p[2], key: DIST_DESIGN(p[2]) }); });
const WALLS = ['#f6f0e2', '#f2cfb3', '#c9d8b6', '#c8dbe6', '#e8d5b0'], ROOFS = ['#c8603f', '#b5543a', '#4f9a86', '#5b5f66', '#8a5a3a'];
for (const h of homes) { h.ang = facing(h.x, h.z); h.tint = { wall: WALLS[(h.num - 1) % 5], roof: h.num % 7 === 0 ? ROOFS[2 + (h.num % 3)] : ROOFS[h.num % 2] }; h.m = mat(h.x, h.z, h.ang, 0.92); }
const NEAR_MAX = PHONE ? 160 : 320, NEAR_R = PHONE ? 85 : 120;
const nearD = {}; for (const key of ['houseStarter', 'sbCottage', 'sbHouse']) nearD[key] = design(key, NEAR_MAX);
const farWall = new T.InstancedMesh((() => { const g = BOX(7.4, 4.6, 7.4); g.translate(0, 2.3, -0.5); return g; })(), toon(0xffffff), homes.length);
const farRoof = new T.InstancedMesh((() => { const s = new T.Shape(); s.moveTo(-4.4, 0); s.lineTo(4.4, 0); s.lineTo(0, 2.6); s.lineTo(-4.4, 0); const g = new T.ExtrudeGeometry(s, { depth: 8, bevelEnabled: false }); g.translate(0, 4.6, -4.5); return g; })(), toon(0xffffff), homes.length);
[farWall, farRoof].forEach(im => { im.instanceColor = new T.InstancedBufferAttribute(new Float32Array(homes.length * 3).fill(1), 3); im.frustumCulled = false; scene.add(im); });
const GRID = 48, grid = new Map(), gk = (x, z) => Math.floor(x / GRID) + ',' + Math.floor(z / GRID);
homes.forEach((h, i) => { const k = gk(h.x, h.z); (grid.get(k) || grid.set(k, []).get(k)).push(i); });
function around(x, z, r) { const out = [], c = Math.ceil(r / GRID), gx = Math.floor(x / GRID), gz = Math.floor(z / GRID); for (let i = -c; i <= c; i++) for (let j = -c; j <= c; j++) { const l = grid.get((gx + i) + ',' + (gz + j)); if (l) for (const k of l) out.push(k); } return out; }
function refreshHomes(px, pz) {
  const cand = around(px, pz, NEAR_R).map(i => [i, (homes[i].x - px) ** 2 + (homes[i].z - pz) ** 2]).filter(a => a[1] < NEAR_R * NEAR_R).sort((a, b) => a[1] - b[1]).slice(0, NEAR_MAX);
  const near = new Set(cand.map(a => a[0])), cnt = {}; for (const k in nearD) cnt[k] = 0;
  for (const [i] of cand) { const h = homes[i]; place(nearD[h.key], cnt[h.key]++, h.m, h.tint); }
  for (const k in nearD) commit(nearD[k], cnt[k]);
  let f = 0; homes.forEach((h, i) => { if (near.has(i)) return; farWall.setMatrixAt(f, h.m); farWall.setColorAt(f, COL.set(h.tint.wall)); farRoof.setMatrixAt(f, h.m); farRoof.setColorAt(f, COL.set(h.tint.roof)); f++; });
  for (const im of [farWall, farRoof]) { im.count = f; im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true; }
}
