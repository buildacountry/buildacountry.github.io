const okCSV = t => !!t && /username/i.test(t.slice(0, 300));

  return C.p = fetch(ST.sheet + (ST.sheet.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : null)
    .then(t => { if (!okCSV(t)) return null; if (t !== C.text) { C.text = t; LS.set('vin_citizens', t); C.subs.forEach(f => f(t)); } return t; }).catch(() => null); }

    await Promise.all(['roads.js', 'kit.js'].map(f => loadScript(f).catch(() => null)));   // step 4: real roads + street life. If one fails to load, the map still opens with the old roads and no street pieces.

  if (med > 50) { LS.set('vin_map_auto', '2d'); setMode('2d'); toast('3D is slow on this phone, so here is the quick 2D map. Tap 3D any time.'); } else LS.set('vin_map_auto', '3d'); }

// ---------- 2D plan ----------
const B = { x0: -480, z0: -900, x1: 1140, z1: 680 };   // the part of the world Maps mode shows, in metres
const V = { el: $('#v2d'), cv: $('#plan'), ctx: null, s: 1, cx: 300, cz: -100, W: 0, H: 0, dpr: 1, homes: [], blds: new Map(), byUser: new Map(), sel: null, me: null, dirty: false, ready: false, labels: [] };

const PL = ST ? ST.plots.split('\n').map(l => { const a = l.split(','); if (a.length > 7) a.splice(5, a.length - 6, a.slice(5, a.length - 1).join(', ').replace(/,\s+/g, ', '));   // a label may hold a comma ("Beach Lane, Flat 1")
  return { x: +a[0], z: +a[1], a: a[2], block: +a[3] || 0, bid: +a[4] || 0, label: a[5] || '', floor: +a[6] || 0 }; }) : [];
function parseCSV(text) { const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c; }

function build2D(text) {
  const seen = new Set(), byNum = new Map(), noNum = [], villas = [], never = ST.never.map(x => x.toLowerCase());
  const st = v => { v = String(v || '').trim().toLowerCase(); return /^(abandon|left|unfollow|gone)/.test(v) ? 'abandoned' : /^(hid|private|anon)/.test(v) ? 'hidden' : 'active'; };
  parseCSV(text).map(r => ({ n: parseInt(String(r.number || '').replace(/[^\d]/g, ''), 10), user: String(r.username || '').trim().replace(/^@/, '').replace(/\s+/g, '').slice(0, 30), job: (r.profession || r.job || '').trim().slice(0, 24), status: st(r.status), shopCol: String(r.shop || '').trim().toLowerCase() }))
    .forEach(r => { const k = r.user.toLowerCase(); if (!r.user && r.status !== 'hidden') return; if (never.includes(k)) return; if (k && seen.has(k)) return; if (k) seen.add(k);

  villas.forEach(r => { const lot = ST.villas[r.user.toLowerCase()], L = (ST.lots || {})[lot]; if (L) V.homes.push(Object.assign(r, { n: 10000 + lot, villa: lot, a: 'V', x: L[0], z: L[1], district: 'Central', area: 'Villa Lane, plot ' + lot })); });

  { const c = document.getElementById('cchipN'); if (c) c.textContent = V.homes.filter(h => h.status !== 'abandoned').length.toLocaleString('en-IN'); }
  const cen = f => { const l = PL.filter(f); return l.length ? [l.reduce((a, p) => a + p.x, 0) / l.length, l.reduce((a, p) => a + p.z, 0) / l.length] : null; };

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(v => v.trim() !== '')).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
