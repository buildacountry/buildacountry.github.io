<style>

:root{--navy:#14233f;--navydk:#08101f;--navy2:#1e3157;--gold:#c9a24a;--golddk:#96772c;--goldlt:#ecd9a4;--paper:#f6ecd6;--sheet:#fffaf0;--ink:#1a2238;--mute:#6f6650;--rule:#dccb9f;--stamp:#b3402e;--terra:#b8693f;--page:#f4e6d2;

#lr{position:fixed;inset:0;z-index:30;background:var(--navy);color:var(--goldlt);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--st)) 20px calc(20px + var(--sb))}

#lc{position:fixed;inset:0;z-index:25}.lcbg{position:absolute;inset:0;background:rgba(8,16,31,.55)}
.lcbox{position:absolute;left:50%;transform:translateX(-50%);top:calc(76px + var(--st));width:calc(100% - 24px);max-width:420px;background:var(--sheet);border:1px solid var(--rule);outline:1px solid var(--gold);outline-offset:-5px;border-radius:8px;padding:20px 18px 18px;box-shadow:0 16px 30px -12px rgba(8,16,31,.7)}

/* ---------- Support Vinland (full-screen sheet, no 3D) ---------- */
#sup{position:fixed;inset:0;z-index:15;background:repeating-linear-gradient(135deg,transparent 0 11px,rgba(201,162,74,.08) 11px 12px),var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
#sup[hidden]{display:none}
#sup .in{max-width:480px;margin:0 auto;padding:0 16px calc(28px + var(--sb))}
#sup .bar{position:sticky;top:0;z-index:2;margin:0 -16px 16px;min-height:calc(60px + var(--st));padding:var(--st) 16px 0;background:var(--navy);color:var(--gold);display:flex;align-items:center;gap:10px;border-bottom:3px double var(--gold)}
#sup .bar b{font:500 19px var(--serif);letter-spacing:.06em;flex:1}
#sup .bar button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);background:none;color:var(--goldlt);font-size:20px;line-height:1}

.stage{perspective:1400px;width:min(92vw,380px,calc((100vh - 230px) * .716));width:min(92vw,380px,calc((100dvh - 230px) * .716))}

.pg{position:absolute;inset:0;border-radius:calc(1.6 * var(--u)) calc(3.6 * var(--u)) calc(3.6 * var(--u)) calc(1.6 * var(--u));overflow:hidden;background:var(--page) var(--guil) center/cover;color:var(--navy);box-shadow:-3px 0 0 #d9c7a6,-6px 0 0 #e9dcc2,0 14px 24px -12px rgba(0,0,0,.7);transform-origin:left center;backface-visibility:hidden}

.dots{display:flex;justify-content:center;gap:6px;margin:14px 0 12px}.dots button{border:0;background:none;color:#b9ad8a;font-size:12.5px;padding:8px 10px;border-bottom:2px solid transparent}.dots .on{color:#fff;border-color:var(--gold)}

</style>
