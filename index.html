<style>
/* Layout: full-bleed 3D capital built from Dev's sketch; floating top bar, info card right (bottom sheet on phone), view buttons bottom-left. Single warm 4 pm look by choice. */
:root { color-scheme: light; --sky: #f1dfbf; --card: rgba(251,246,236,.96); --line: rgba(80,60,40,.16); --ink: #2f2b28; --ink-dim: #6f6458; --terracotta: #c8603f; --copper: #4f9a86; --copper-ink: #12392f;
  --display: "Bricolage Grotesque", "Poppins", system-ui, sans-serif; --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; } #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.lbl.place { background: var(--copper); color: #f4fbf8; border-color: var(--copper); }
.lbl.sel { background: var(--terracotta); color: #fff8ef; border-color: var(--terracotta); z-index: 2; }
.topbar { position: fixed; z-index: 8; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.brand { pointer-events: auto; margin-right: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; display: grid; gap: 2px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1; }
.brand p { margin: 0; font-size: .76rem; color: var(--ink-dim); } .brand b { color: var(--terracotta); font-variant-numeric: tabular-nums; }
.search { pointer-events: auto; position: relative; width: min(320px, 100%); }
.search input { width: 100%; box-sizing: border-box; font: inherit; font-size: .92rem; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px; outline: none; }
.search input:focus-visible { border-color: var(--terracotta); }
.results { position: absolute; z-index: 10; top: calc(100% + 6px); left: 0; right: 0; background: #fbf7ee; border: 1px solid var(--line); border-radius: 14px; overflow-y: auto; max-height: min(360px, 60vh); box-shadow: 0 12px 32px rgba(40,30,20,.18); }
.results button.on { background: rgba(200,96,63,.12); }
.results .hint { padding: 10px 14px; font-size: .8rem; color: var(--ink-dim); border-bottom: 1px solid var(--line); }
.results button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .88rem; color: var(--ink); background: none; border: 0; padding: 10px 14px; cursor: pointer; }
.results button:hover, .results button:focus-visible { background: rgba(200,96,63,.1); outline: none; } .results span { color: var(--ink-dim); font-size: .78rem; }
.controls { position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; }
.controls button { font: inherit; font-size: .84rem; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
#compass { display: flex; align-items: center; gap: 2px; padding: 6px 10px 6px 6px; } #compass span { font-weight: 800; font-size: .78rem; color: #c8603f; }
.controls button[aria-pressed="true"] { background: var(--copper); color: #f4fbf8; border-color: var(--copper); }
.controls button:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; }
.card { position: fixed; z-index: 6; top: calc(92px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 330px; max-height: calc(100% - 120px); overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.eyebrow { margin: 0; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }

.pill { justify-self: start; font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--terracotta); color: #fff8ef; }
.pill.open { background: transparent; color: #7a2f18; border: 1px dashed var(--terracotta); } .pill.civic { background: var(--copper); color: #f4fbf8; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: .86rem; } .facts dt { color: var(--ink-dim); } .facts dd { margin: 0; min-width: 0; }
.units { margin: 10px 0 0; padding-left: 0; list-style: none; display: grid; gap: 4px; font-size: .84rem; } .units i { color: var(--ink-dim); }
.p { margin: 0; font-size: .88rem; line-height: 1.55; color: var(--ink-dim); }
.btn { justify-self: start; font: inherit; font-size: .86rem; font-weight: 600; border-radius: 12px; padding: 10px 14px; cursor: pointer; border: 1px solid var(--terracotta); background: var(--terracotta); color: #fff8ef; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.toast { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fbf6ec; font-size: .86rem; padding: 10px 16px; border-radius: 999px; max-width: calc(100% - 32px); }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 1.2rem; color: var(--ink-dim); }
@media (max-width: 720px) { .card { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 40%; border-radius: 20px 20px 0 0;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(v => v.trim() !== '')).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
function cleanName(u) { return String(u || '').trim().replace(/^@/, '').replace(/\s+/g, '').slice(0, 30); }

function orderRing(cells, start) { cells.sort((a, b) => Math.atan2(a[1], a[0]) - Math.atan2(b[1], b[0])); const k = Math.max(0, cells.findIndex(c => c[0] === start[0] && c[1] === start[1])); return cells.slice(k).concat(cells.slice(0, k)); }

const bigLots = new Map();
function buildBigLots(hs) {
  bigLotObjs.forEach(o => { scene.remove(o); o.traverse(m => { const k = pickables.indexOf(m); if (k >= 0) pickables.splice(k, 1); }); }); bigLotObjs = [];
  bigLotLbls.forEach(l => { l.el.remove(); const k = eduLbls.indexOf(l); if (k >= 0) eduLbls.splice(k, 1); }); bigLotLbls = []; bigLots.clear();
  hs.filter(h => h.status !== 'abandoned' && h.status !== 'hidden' && h.bigLot).forEach(h => {
    const L = LOTS[h.bigLot]; if (!L) return;
    if (!bigLots.has(h.bigLot)) bigLots.set(h.bigLot, { n: h.bigLot, owners: [], staff: [] });
    bigLots.get(h.bigLot)[h.bigStaff ? 'staff' : 'owners'].push(h);
  });
  Object.values(LOTS).forEach(L => { if (L.sign) L.sign.visible = true; });
  bigLots.forEach(lot => {
    if (!lot.owners.length) return;
    const L = LOTS[lot.n], kind = bigKind(lot.owners[0].job), m = /\(([^)]+)\)/.exec(lot.owners[0].job || '');
    lot.kind = kind; lot.name = kind === 'news' && m ? m[1] : BIG_NAMES[kind];
    const g = bigBuilding(kind, lot.name); g.position.set(L.x, 0, L.z); g.rotation.y = L.ry;
    const o = bakeKeep(g, 'lot:' + lot.n); bigLotObjs.push(o);
    if (L.sign) L.sign.visible = false;
    lot.owners.forEach(h => { h.lotRef = lot; }); lot.staff.forEach(h => { h.lotRef = lot; });
    const el = document.createElement('div'); el.className = 'lbl shop'; el.innerHTML = `<b>${esc(lot.name)}</b> <span>@${esc(lot.owners[0].user)}${lot.owners.length > 1 ? ' +' + (lot.owners.length - 1) : ''}</span>`;
    document.getElementById('labels').appendChild(el); const lb = { el, lp: new THREE.Vector3(L.x, 16, L.z) }; eduLbls.push(lb); bigLotLbls.push(lb);
  });
}
function selectLot(n) {
  const lot = bigLots.get(n); if (!lot) return; stopTour(); track('tap-biglot');
  const L = LOTS[n]; flyTo(new THREE.Vector3(L.x, 4, L.z), new THREE.Vector3(-L.sg * 46, 34, 30));
  const who = lot.owners.map(h => '@' + esc(h.user) + (h.job ? ' · ' + esc(h.job) : '')).join('<br>');
  show('Commercial Lane · Lot ' + n + ' · ' + BIG_EYES[lot.kind], lot.name,
    `<dl class="facts"><dt>${lot.owners.length > 1 ? 'Run by' : 'Owner'}</dt><dd>${who}</dd>${lot.staff.length ? `<dt>Works here</dt><dd>${lot.staff.map(h => '@' + esc(h.user)).join(', ')}</dd>` : ''}</dl>

  const b = document.getElementById('visitLotOwner'); if (b) b.onclick = () => selectHome(lot.owners[0]);
}

const viewWhole = () => { const n = wrap.clientWidth < wrap.clientHeight; flyTo(new THREE.Vector3(0, 0, -10), n ? new THREE.Vector3(120, 1300, 520) : new THREE.Vector3(160, 1000, 780), 1600); };   // the whole country, sea to south district
const flyFlag = () => flyTo(new THREE.Vector3(0, 6, 0), new THREE.Vector3(32, 22, 42));

// ---------- visit events (GoatCounter). Never sends what people type, only what happened. ----------
function track(name) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true }); } catch (e) {} }
// ---------- search ----------
const q = document.getElementById('q'), res = document.getElementById('results');
let searchT = 0;
let pick = 0;
function runSearch() {
  const raw = q.value.trim(), s = raw.replace(/^@/, '').replace(/^#/, '').toLowerCase();
  if (!s) { res.hidden = true; return; }
  const num = /^\d+$/.test(s) ? +s : 0;
  const score = h => { if (num && h.n === num) return 0; const u = h.user.toLowerCase(); if (h.status === 'hidden') return 99; if (u === s) return 1; if (u.startsWith(s)) return 2; if (u.includes(s)) return 3; if (h.status !== 'abandoned' && (h.job || '').toLowerCase().includes(s)) return 4; return 99; };
  const m = homes.map(h => [score(h), h]).filter(x => x[0] < 99).sort((a, b) => a[0] - b[0] || a[1].n - b[1].n).map(x => x[1]).slice(0, 8);
  pick = 0;
  const label = h => h.status === 'abandoned' ? 'Abandoned' : (h.founder ? 'Founder home' : 'Home') + ' #' + h.n;
  res.innerHTML = m.length
    ? `<div class="hint">${m.length === 1 ? '1 home found' : m.length + ' homes found'} · press Enter to go</div>` + m.map((h, i) => `<button data-n="${h.n}" class="${i === 0 ? 'on' : ''}">${esc(h.shown)}<span>${label(h)}${h.job && h.status !== 'abandoned' ? ' · ' + esc(h.job) : ''}</span></button>`).join('')
    : `<div class="empty-res"><b>No home for "${esc(raw)}" yet</b><span>Check the spelling, or follow <a href="https://www.instagram.com/buildacountry/" target="_blank" rel="noopener">@buildacountry</a>. New homes are added every day.</span></div>`;
  res.hidden = false;
  clearTimeout(searchT); searchT = setTimeout(() => track(m.length ? 'search-found' : 'search-not-found'), 1500);   // once typing stops
  res.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => { const h = homes.find(x => x.n === +b.dataset.n); res.hidden = true; track('search-open-home'); q.value = ''; q.blur(); if (narrow) setMin(false); selectHome(h); });
}
q.addEventListener('input', runSearch);
// any 'Follow @buildacountry' link (header, card, empty search)
document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href*="instagram.com/buildacountry"]'); if (a) track('tap-follow'); }, true);
q.addEventListener('focus', () => { if (q.value.trim()) runSearch(); });
q.addEventListener('keydown', e => {
  const bs = [...res.querySelectorAll('button[data-n]')];
  if (e.key === 'Escape') { res.hidden = true; q.blur(); return; }
  if (!bs.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pick = (pick + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, i) => b.classList.toggle('on', i === pick)); bs[pick].scrollIntoView({ block: 'nearest' }); }
  if (e.key === 'Enter') { e.preventDefault(); bs[pick].click(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement !== q) closeCard(); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) res.hidden = true; });

const tourBtn = document.getElementById('tour');
function stopTour() { touring = false; tourBtn.setAttribute('aria-pressed', 'false'); tourBtn.textContent = 'Auto tour'; }
tourBtn.onclick = () => { touring = !touring; if (touring) track('auto-tour'); tourBtn.setAttribute('aria-pressed', String(touring)); tourBtn.textContent = touring ? 'Stop tour' : 'Auto tour'; if (touring && selected) { clearSelection(); } if (touring) { closeCard(); viewAll(); } };
const compassNeedle = document.getElementById('compassNeedle');
document.getElementById('compass').onclick = () => { stopTour(); track('compass'); const t = controls.target.clone(), d = Math.hypot(camera.position.x - t.x, camera.position.z - t.z);
  flyTo(t, new THREE.Vector3(0, camera.position.y - t.y, d), 900); };   // keep height and distance, stand south of the target looking north
document.getElementById('all').onclick = () => { stopTour(); clearSelection(); showKey('welcome'); if (narrow) setMin(true); viewWhole(); };
document.getElementById('flagBtn').onclick = () => { stopTour(); clearSelection(); showKey('flag'); flyFlag(); };

function resize() { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
camera.position.set(180, 200, 270); controls.target.set(0, 0, 0);
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  nightFrame(now); plazaFrame(now);
  if (WALK.on) walkFrame(dt, now); else {
  if (fly) { const k = ease(Math.min(1, (now - fly.t0) / fly.ms)); controls.target.lerpVectors(fly.fT, fly.tT, k); camera.position.lerpVectors(fly.fP, fly.tP, k); if (k >= 1) fly = null; }
  if (touring) { const t = controls.target, dx = camera.position.x - t.x, dz = camera.position.z - t.z, a = dt * 0.12;
    camera.position.x = t.x + dx * Math.cos(a) - dz * Math.sin(a); camera.position.z = t.z + dx * Math.sin(a) + dz * Math.cos(a); }
  if (!reduce) flag.scale.x = 1 + Math.sin(now / 220) * 0.06;
  if (!reduce && COAST.foam) { COAST.foam.position.z = COAST.shore + 1 + Math.sin(now / 900) * 1.4; }
  { const dx = controls.target.x - camera.position.x, dz = controls.target.z - camera.position.z; compassNeedle.style.transform = 'rotate(' + (Math.atan2(dx, -dz) * -180 / Math.PI).toFixed(1) + 'deg)'; }
  controls.update(); clampView(); }
  const tg = controls.target; sun.target.position.set(Math.round(tg.x / 8) * 8, 0, Math.round(tg.z / 8) * 8); sun.position.copy(sun.target.position).add(SUN_OFF);
  if (!panelOpen) { updatePeople(dt, now); renderer.render(scene, camera); updateLabels(); updateLayoutLabels(); updateEduLabels(); }
  requestAnimationFrame(frame);
}

const JOB_EMOJI = { blacksmith: '⚒️', merchant: '🧺', 'self-defence teacher': '🥋', gunsmith: '🔧', 'gym owner': '🏋️', mechanic: '🔩', chef: '🍜', doctor: '🩺', engineer: '📐', builder: '🏗️', carpenter: '🪚', 'arms supplier': '📦', 'financial adviser': '💼', explorer: '🧭', knight: '⚔️', 'guardian of the flag': '🏳️', pilot: '✈️', philosopher: '📜', astronaut: '🚀', soldier: '🛡️', banker: '🏦', 'banker & port owner': '⚓', 'school principal': '🏫', 'school founder': '🏫', 'scholar knight commander': '📚', 'rival king': '👑', wizard: '🧙', lawmaker: '⚖️', 'park caretaker': '🌳', musketeer: '🎖️', 'defence chief': '🛡️', 'aviation chief': '🛩️', 'gym': '🏋️' };
const FACES = ['🙂', '😄', '😎', '🤠', '🥳', '😊', '🤓', '😌', '🙃', '😁'];
const AV_BG = ['#e8d5b0', '#c9d8b6', '#c8dbe6', '#f2cfb3', '#d9cfe6', '#f0e0a8'];
const hashStr = s => { let x = 7; for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 9973; return x; };
const avatarOf = h => h.status === 'hidden' ? '🙂' : (JOB_EMOJI[(h.job || '').toLowerCase()] || FACES[hashStr(h.user) % FACES.length]);
let demands = [], mood = {}, notices = [];

// ---------- tabs ----------
const tabsEl = document.getElementById('tabs'), panelsEl = document.getElementById('panels');
let tab = 'map', panelOpen = false;
function setTab(t) {
  if (t !== tab && t !== 'map') track('tab-' + t);
  tab = t; panelOpen = t !== 'map';
  tabsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === t)));
  panelsEl.querySelectorAll('section').forEach(s => s.hidden = s.dataset.tab !== t);
  document.body.classList.toggle('panel-open', panelOpen);
  panelsEl.style.top = (document.querySelector('.topbar').offsetHeight) + 'px';
  if (panelOpen) { panelsEl.scrollTop = 0; renderPanel(t); stopTour(); }
  try { history.replaceState(null, '', t === 'map' ? location.pathname + (location.hash.startsWith('#home-') ? location.hash : '') : '#' + t); } catch (e) {}
}
tabsEl.querySelectorAll('button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
window.addEventListener('resize', () => { if (panelOpen) panelsEl.style.top = document.querySelector('.topbar').offsetHeight + 'px'; });
function renderPanel(t) { if (t === 'citizens') renderCitizens(); if (t === 'country') renderCountry(); if (t === 'estate') renderEstate(); if (t === 'locked') renderLocked(); }

// ---------- citizens ----------
let cFilter = 'All', cQuery = '', cShowAll = false;
function renderCitizens() {
  const sec = panelsEl.querySelector('[data-tab="citizens"]');
  const live = homes.filter(h => h.status !== 'abandoned');
  const q = cQuery.trim().replace(/^@/, '').toLowerCase();
  const list = live.filter(h => {
    if (cFilter === 'Founders' && !h.founder) return false; if (cFilter === 'Has a job' && !h.job) return false; if (cFilter === 'No job yet' && h.job) return false; if (cFilter === 'Shop owners' && !h.shopRef) return false;
    if (!q) return true; if (h.status === 'hidden') return false; return h.user.toLowerCase().includes(q) || (h.job || '').toLowerCase().includes(q); });
  const shown = cShowAll ? list : list.slice(0, 60);
  sec.innerHTML = `<div class="pwrap">
    <div class="phead"><div><h2>Citizens</h2><p>${list.length === live.length ? live.length + ' citizens live here right now' : list.length + ' of ' + live.length + ' citizens'}</p></div>
      <label class="psearch">Find a citizen<input id="cq" type="search" value="${esc(cQuery)}" placeholder="Type an Instagram name or a job" autocomplete="off"></label></div>
    <div class="chips">${['All', 'Founders', 'Has a job', 'Shop owners', 'No job yet'].map(f => `<button data-f="${f}" aria-pressed="${f === cFilter}">${f}</button>`).join('')}</div>
